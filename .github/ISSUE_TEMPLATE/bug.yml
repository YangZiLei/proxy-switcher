name: Bug report
description: Report a proxy-switcher problem (white screen, inject, launch, install)
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - opencode
        - antigravity (agy)
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Desktop or CLI
      options:
        - desktop
        - CLI
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: Proxy client and port
      description: e.g. Clash / FastLink / v2rayN on 127.0.0.1:7892
      placeholder: Clash 127.0.0.1:7892
    validations:
      required: true
  - type: dropdown
    id: tun
    attributes:
      label: TUN mode
      options:
        - "off"
        - "on"
        - unknown
    validations:
      required: true
  - type: input
    id: marker
    attributes:
      label: Marker state
      description: Does the marker file exist? (~/.opencode-proxy-on or ~/.agy-proxy-on)
      placeholder: "on (file exists) / off (file missing)"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log line
      description: Paste the Electron / launcher line if you have one (ERR_TIMED_OUT, ERR_CONNECTION_TIMED_OUT, etc.)
      placeholder: Failed to load URL: https://127.0.0.1:xxxxx/ with error: ERR_TIMED_OUT
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: What happened
      description: Steps and expected vs actual behavior
    validations:
      required: true
